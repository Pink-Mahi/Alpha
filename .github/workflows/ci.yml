name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ts:
    name: TS (Bun) — install, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Run per-package tests that use bun:test
      - run: cd runtimes/local-agent && bun test
      - run: cd apps/tray-agent && bun test

  python:
    name: Python — lint, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/model-router
          - shared/agent-protocol/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: ${{ matrix.service }}
        run: |
          uv sync --all-extras
          uv run ruff check src
          uv run pytest -q

  protocol-validate:
    name: Agent protocol — schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: shared/agent-protocol/ts
        run: |
          bun install
          bun run validate

  terraform-fmt:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
      - working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          # validate needs provider downloads; skip in CI until backend configured.
          # terraform init -backend=false
          # terraform validate
