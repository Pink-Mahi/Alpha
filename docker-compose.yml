# Docker Compose — local dev infrastructure for Alpha.
# Starts Postgres (with pgvector) + Redis for the control plane.
#
# Usage: docker compose up -d
# Then: DATABASE_URL=postgres://alpha:alpha@localhost:5432/alpha

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alpha-postgres
    environment:
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha
      POSTGRES_DB: alpha
    ports:
      - "5432:5432"
    volumes:
      - alpha-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alpha-redis
    ports:
      - "6379:6379"
    volumes:
      - alpha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  alpha-pg-data:
  alpha-redis-data:
