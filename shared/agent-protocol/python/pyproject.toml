[project]
name = "cascade-agent-protocol"
version = "0.0.0"
description = "Canonical agent protocol types shared by Python services (agent-control, voice-control, model-router, cloud-agent)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_agent_protocol"]

[tool.ruff]
line-length = 100
target-version = "py312"
