# Docker Compose — full Cascade stack for local/staging.
# Builds all services from source and connects them.
#
# Usage: docker compose -f docker-compose.full.yml up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: cascade
      POSTGRES_DB: cascade
    ports: ["5432:5432"]
    volumes: [cascade-pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [cascade-redis-data:/data]

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: services/control-plane
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade
      JWT_SECRET: dev-secret-change-me
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      postgres:
        condition: service_healthy

  model-router:
    build:
      context: .
      dockerfile: Dockerfile.py
    ports: ["8081:8081"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  local-agent:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: runtimes/local-agent
    ports: ["8083:8083"]
    environment:
      PORT: "8083"
      MODEL_ROUTER_URL: http://model-router:8081

  memory-service:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: services/memory-service
    ports: ["8084:8084"]
    environment:
      PORT: "8084"
      CONTROL_PLANE_URL: http://control-plane:8080

  tray-agent:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: apps/tray-agent
    ports: ["8085:8085"]
    environment:
      PORT: "8085"

  cloud-agent:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: runtimes/cloud-agent
    ports: ["8088:8088"]
    environment:
      PORT: "8088"

  voice-service:
    build:
      context: .
      dockerfile: Dockerfile.ts
      args:
        SERVICE_DIR: services/voice-service
    ports: ["8089:8089"]
    environment:
      PORT: "8089"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC_placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder}
      TWILIO_CASCADE_NUMBER: ${TWILIO_CASCADE_NUMBER:-+10000000000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_WEBHOOK_URL: ${VOICE_WEBHOOK_URL:-http://localhost:8089}

volumes:
  cascade-pg-data:
  cascade-redis-data:
