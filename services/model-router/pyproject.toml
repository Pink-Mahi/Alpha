[project]
name = "ALPHA-model-router"
version = "0.0.0"
description = "Multi-provider LLM router: cost/latency/quality policy, caching, streaming, tool-call bridging."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "redis>=5.2.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ALPHA_model_router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
